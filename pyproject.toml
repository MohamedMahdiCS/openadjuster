[project]
name = "openadjuster"
version = "0.1.0.dev0"
description = "Open-source AI claims adjuster: an evidence-first agent for outpatient insurance claims that runs fully on a laptop with open-weight models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Mahdi" }]
requires-python = ">=3.12"
dependencies = [
    "claimdocbench",
    "ocrmac>=1.0; sys_platform == 'darwin'",
    "pillow>=11,<13",
    "pydantic>=2.9,<3",
]

[project.scripts]
openadjuster = "openadjuster.cli:main"

[project.urls]
Repository = "https://github.com/MohamedMahdiCS/openadjuster"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv.sources]
# Local sibling checkout during development; CI checks it out next to this repo.
claimdocbench = { path = "../claimdocbench", editable = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openadjuster"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ocrmac.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
